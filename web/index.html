<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>note-app</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(circle at 50% 0%, #1b1b1f, #000 70%);
    color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .card { width: min(560px, 92vw); padding: 32px; border-radius: 22px; text-align: center;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { margin: 0 0 22px; color: rgba(255,255,255,.6); }
  button { padding: 14px 28px; border: 0; border-radius: 14px; font: inherit; font-weight: 600;
    background: #fff; color: #000; }
  #out { margin-top: 18px; color: rgba(255,255,255,.85); }
</style>
</head>
<body>
  <main class="card">
    <h1>note-app</h1>
    <p>Built by ZYRAXON-Pro · Only Power AI · ZYRAXON Lab</p>
    <button id="go">Tap me</button>
    <div id="out"></div>
  </main>
<script>
  document.getElementById('go').addEventListener('click', function () {
    document.getElementById('out').textContent = 'Running natively at ' + new Date().toLocaleTimeString();
  });
</script>
</body>
</html>

name: ZYRAXON-Pro build
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop installers
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Electron
        run: npm install --no-save electron electron-builder
      - name: Package installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --config electron-builder.json
      - uses: actions/upload-artifact@v4
        with:
          name: zyraxon-desktop-suite-${{ matrix.artifact }}
          path: dist/**
      - name: Publish download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ZYRAXON Desktop Suite build ${{ github.run_number }}
          body: Built by ZYRAXON-Pro
          files: dist/*

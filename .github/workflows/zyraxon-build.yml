name: ZYRAXON-Pro build
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        run: |
          SDK="$ANDROID_HOME"
          echo "Using SDK at $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Build signed APK
        run: bash .zyraxon/build-apk.sh "streakly" "com.zyraxon.streakly" "web"
      - name: Verify the APK carries the real UI
        run: |
          # A signed APK proves nothing about its contents: an earlier build
          # shipped a placeholder <h1>app-name</h1> because the UI was not where
          # the script looked. Compare what is inside the APK against the UI that
          # was meant to go in, and fail the job when they disagree.
          python3 - <<'PY'
          import glob, hashlib, zipfile, sys
          apks = glob.glob("out/*.apk")
          assert apks, "no APK was produced"
          src = open("web/index.html", "rb").read()
          want = hashlib.sha256(src).hexdigest()
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  dex = [n for n in z.namelist() if n.endswith(".dex")]
                  assert dex, f"{apk} has no classes.dex and cannot run"
                  got = hashlib.sha256(z.read("assets/index.html")).hexdigest()
                  assert got == want, (
                      f"{apk} carries a different UI than web/index.html "
                      f"({len(src)} bytes expected) — it shipped a placeholder"
                  )
              print(f"{apk}: real UI embedded, dex present")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: streakly-apk
          path: out/*.apk
      - name: Publish download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: streakly build ${{ github.run_number }}
          body: Built by ZYRAXON-Pro
          files: out/*.apk

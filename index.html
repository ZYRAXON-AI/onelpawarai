<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>নোট অ্যাপ — ZYRAXON</title>
<meta name="theme-color" content="#6366f1">
<style>
  :root{
    --bg:#0b0f1a;
    --surface:#13192b;
    --surface2:#1c2340;
    --border:#2a3257;
    --text:#eef2ff;
    --muted:#9aa3c7;
    --primary:#6366f1;
    --primary2:#8b5cf6;
    --accent:#22d3ee;
    --danger:#ef4444;
    --success:#22c55e;
    --warning:#f59e0b;
    --shadow:0 10px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
  body{overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:var(--shadow);z-index:10;flex-shrink:0}
  header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
  header .actions{display:flex;gap:8px}
  .btn{border:none;cursor:pointer;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;color:#fff;background:rgba(255,255,255,.15);backdrop-filter:blur(6px)}
  .btn:hover{background:rgba(255,255,255,.25);transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,#22c55e,#16a34a)}
  .btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.08)}

  .layout{display:flex;flex:1;overflow:hidden}
  .sidebar{width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:.25s}
  .search{padding:12px;border-bottom:1px solid var(--border)}
  .search input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);outline:none;font-size:14px}
  .search input:focus{border-color:var(--primary)}
  .notes-list{flex:1;overflow-y:auto;padding:8px}
  .note-item{padding:12px;border-radius:12px;margin-bottom:6px;cursor:pointer;border:1px solid transparent;transition:.15s;position:relative}
  .note-item:hover{background:var(--surface2)}
  .note-item.active{background:var(--surface2);border-color:var(--primary)}
  .note-item .title{font-weight:600;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note-item .preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note-item .meta{font-size:10px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
  .note-item .pin{position:absolute;top:8px;right:8px;color:var(--warning);font-size:12px}
  .empty-list{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
  .empty-list .icon{font-size:48px;margin-bottom:10px;opacity:.5}

  .editor{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  .editor-toolbar{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--surface)}
  .tool-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
  .tool-btn:hover{border-color:var(--primary);color:var(--primary)}
  .tool-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .color-picker{width:28px;height:28px;border-radius:6px;border:2px solid var(--border);cursor:pointer;padding:0;background:none}
  .editor-body{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:16px}
  .title-input{width:100%;padding:12px 14px;border:none;background:transparent;color:var(--text);font-size:20px;font-weight:700;outline:none;border-bottom:1px solid var(--border);margin-bottom:8px}
  .title-input::placeholder{color:var(--muted)}
  .rich-editor{flex:1;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:15px;line-height:1.7;overflow-y:auto;outline:none;min-height:200px}
  .rich-editor:empty:before{content:attr(data-placeholder);color:var(--muted)}
  .rich-editor h1,.rich-editor h2,.rich-editor h3{margin:12px 0 6px}
  .rich-editor ul,.rich-editor ol{margin:8px 0 8px 22px}
  .rich-editor blockquote{border-left:3px solid var(--primary);padding-left:12px;color:var(--muted);margin:8px 0}
  .rich-editor code{background:var(--surface2);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px}
  .rich-editor pre{background:var(--surface2);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
  .tags-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .tag{padding:4px 10px;border-radius:20px;background:var(--surface2);color:var(--accent);font-size:11px;font-weight:600;border:1px solid var(--border)}
  .tag input{background:transparent;border:none;color:var(--accent);outline:none;width:80px;font-size:11px}
  .status-bar{display:flex;justify-content:space-between;padding:8px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);background:var(--surface);flex-shrink:0}

  .fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 8px 24px rgba(99,102,241,.5);display:none;z-index:20}
  @media (max-width:720px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);width:85vw;max-width:320px}
    .sidebar.open{transform:translateX(0)}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;display:none}
    .overlay.open{display:block}
    .fab{display:flex;align-items:center;justify-content:center}
    .back-btn{display:inline-flex}
  }
  .back-btn{display:none}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.open{display:flex}
  .modal-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow)}
  .modal-card h3{margin-bottom:12px}
  .modal-card p{color:var(--muted);font-size:13px;margin-bottom:16px;line-height:1.5}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);color:var(--text);padding:10px 18px;border-radius:10px;border:1px solid var(--border);font-size:13px;opacity:0;transition:.3s;z-index:100;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .stats{display:flex;gap:16px;padding:10px 16px;font-size:12px;color:var(--muted)}
  .stats b{color:var(--text)}
  .import-export{display:flex;gap:6px}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--surface)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--primary)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📝 নোট অ্যাপ</h1>
    <div class="actions">
      <button class="btn" id="exportBtn" title="রপ্তানি">⬇️ রপ্তানি</button>
      <button class="btn" id="importBtn" title="আমদানি">⬆️ আমদানি</button>
      <button class="btn primary" id="newNoteBtn">+ নতুন নোট</button>
    </div>
  </header>
  <div class="layout">
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="search">
        <input type="text" id="searchInput" placeholder="🔍 নোট খুঁজুন...">
      </div>
      <div class="notes-list" id="notesList"></div>
    </aside>
    <main class="editor">
      <div class="editor-toolbar">
        <button class="back-btn btn ghost" id="backBtn">← তালিকা</button>
        <button class="tool-btn" data-cmd="bold" title="Bold"><b>B</b></button>
        <button class="tool-btn" data-cmd="italic" title="Italic"><i>I</i></button>
        <button class="tool-btn" data-cmd="underline" title="Underline"><u>U</u></button>
        <button class="tool-btn" data-cmd="strikeThrough" title="Strike">S̶</button>
        <button class="tool-btn" data-cmd="h1" title="Heading 1">H1</button>
        <button class="tool-btn" data-cmd="h2" title="Heading 2">H2</button>
        <button class="tool-btn" data-cmd="ul" title="Bullet list">•</button>
        <button class="tool-btn" data-cmd="ol" title="Numbered list">1.</button>
        <button class="tool-btn" data-cmd="quote" title="Quote">❝</button>
        <button class="tool-btn" data-cmd="code" title="Code">&lt;/&gt;</button>
        <button class="tool-btn" data-cmd="hr" title="Divider">—</button>
        <input type="color" class="color-picker" id="colorPicker" value="#6366f1" title="রঙ">
        <button class="tool-btn" id="pinBtn" title="পিন">📌</button>
        <button class="tool-btn" id="deleteBtn" title="মুছুন">🗑️</button>
      </div>
      <div class="editor-body">
        <input type="text" class="title-input" id="titleInput" placeholder="নোটের শিরোনাম...">
        <div class="rich-editor" id="editor" contenteditable="true" data-placeholder="এখানে লিখুন... আপনার চিন্তা, আইডিয়া, কাজের তালিকা..."></div>
        <div class="tags-row" id="tagsRow"></div>
      </div>
      <div class="status-bar">
        <span id="wordCount">০ শব্দ</span>
        <span id="lastSaved">সংরক্ষিত হয়নি</span>
        <span id="noteCount">০ টি নোট</span>
      </div>
    </main>
  </div>
  <button class="fab" id="fabBtn">+</button>
</div>

<div class="modal" id="confirmModal">
  <div class="modal-card">
    <h3 id="modalTitle">নিশ্চিত?</h3>
    <p id="modalMsg">এই নোটটি মুছে ফেলবেন?</p>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">বাতিল</button>
      <button class="btn danger" id="modalConfirm">মুছুন</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none">

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'zyraxon_notes_v1';
let notes = [];
let activeId = null;
let saveTimer = null;

const $ = (s)=>document.querySelector(s);
const $$ = (s)=>document.querySelectorAll(s);

function uid(){return 'n_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function now(){return new Date().toISOString()}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('bn-BD',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'})}

function loadNotes(){
  try{notes=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){notes=[]}
  if(!Array.isArray(notes))notes=[];
}
function saveNotes(){localStorage.setItem(STORAGE_KEY,JSON.stringify(notes))}

function createNote(){
  const n={id:uid(),title:'',content:'',pinned:false,tags:[],created:now(),updated:now(),color:'#6366f1'};
  notes.unshift(n);
  activeId=n.id;
  saveNotes();
  renderList();
  openNote(n.id);
  toast('নতুন নোট তৈরি হয়েছে');
}

function openNote(id){
  activeId=id;
  const n=notes.find(x=>x.id===id);
  if(!n)return;
  $('#titleInput').value=n.title;
  $('#editor').innerHTML=n.content||'';
  $('#colorPicker').value=n.color||'#6366f1';
  renderTags(n);
  renderList();
  updateStatus();
  if(window.innerWidth<=720){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open')}
}

function updateActive(){
  const n=notes.find(x=>x.id===activeId);
  if(!n)return;
  n.title=$('#titleInput').value;
  n.content=$('#editor').innerHTML;
  n.color=$('#colorPicker').value;
  n.updated=now();
  saveNotes();
  renderList(true);
  updateStatus();
}

function deleteNote(id){
  notes=notes.filter(x=>x.id!==id);
  if(activeId===id){activeId=notes.length?notes[0].id:null}
  saveNotes();
  renderList();
  if(activeId)openNote(activeId); else clearEditor();
  toast('নোট মুছে ফেলা হয়েছে');
}

function clearEditor(){
  $('#titleInput').value='';
  $('#editor').innerHTML='';
  $('#tagsRow').innerHTML='';
}

function togglePin(){
  const n=notes.find(x=>x.id===activeId);
  if(!n)return;
  n.pinned=!n.pinned;
  n.updated=now();
  saveNotes();
  renderList();
  toast(n.pinned?'📌 পিন করা হয়েছে':'পিন সরানো হয়েছে');
}

function renderTags(n){
  const row=$('#tagsRow');
  row.innerHTML='';
  (n.tags||[]).forEach((t,i)=>{
    const span=document.createElement('span');span.className='tag';span.textContent=t+' ✕';
    span.onclick=()=>{n.tags.splice(i,1);saveNotes();renderTags(n);renderList(true)};
    row.appendChild(span);
  });
  const inp=document.createElement('input');inp.type='text';inp.placeholder='+ ট্যাগ';inp.style.background='transparent';inp.style.border='none';inp.style.color='var(--accent)';inp.style.outline='none';inp.style.width='90px';inp.style.fontSize='11px';
  inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){n.tags.push(inp.value.trim());inp.value='';saveNotes();renderTags(n);renderList(true)}};
  const wrap=document.createElement('span');wrap.className='tag';wrap.style.background='transparent';wrap.style.border='1px dashed var(--border)';wrap.appendChild(inp);
  row.appendChild(wrap);
}

function renderList(keepScroll){
  const list=$('#notesList');
  const q=$('#searchInput').value.toLowerCase().trim();
  let filtered=notes.filter(n=>{
    if(!q)return true;
    return (n.title||'').toLowerCase().includes(q)||(n.content||'').toLowerCase().replace(/<[^>]*>/g,'').includes(q)||(n.tags||[]).some(t=>t.toLowerCase().includes(q));
  });
  filtered.sort((a,b)=>(b.pinned-a.pinned)||(new Date(b.updated)-new Date(a.updated)));
  const scroll=list.scrollTop;
  list.innerHTML='';
  if(filtered.length===0){list.innerHTML='<div class="empty-list"><div class="icon">📝</div>'+ (q?'কোনো নোট পাওয়া যায়নি':'এখনো কোনো নোট নেই<br>নতুন নোট তৈরি করুন')+'</div>';return}
  filtered.forEach(n=>{
    const div=document.createElement('div');
    div.className='note-item'+(n.id===activeId?' active':'');
    const title=n.title||'শিরোনামহীন নোট';
    const preview=(n.content||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,60)||'কোনো কন্টেন্ট নেই';
    div.innerHTML=(n.pinned?'<span class="pin">📌</span>':'')+
      '<div class="title">'+escapeHtml(title)+'</div>'+
      '<div class="preview">'+escapeHtml(preview)+'</div>'+
      '<div class="meta"><span>'+fmtDate(n.updated)+'</span><span>'+ (n.tags||[]).length +' ট্যাগ</span></div>';
    div.onclick=()=>openNote(n.id);
    list.appendChild(div);
  });
  if(keepScroll)list.scrollTop=scroll;
}

function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function updateStatus(){
  const n=notes.find(x=>x.id===activeId);
  const text=($('#editor').innerText||'').trim();
  const words=text?text.split(/\s+/).length:0;
  $('#wordCount').textContent=toBn(words)+' শব্দ';
  $('#noteCount').textContent=toBn(notes.length)+' টি নোট';
  if(n)$('#lastSaved').textContent='সর্বশেষ সংরক্ষণ: '+fmtDate(n.updated);
}

function toBn(num){return String(num).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d])}

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}

function execCmd(cmd){
  const editor=$('#editor');
  editor.focus();
  switch(cmd){
    case 'h1': document.execCommand('formatBlock',false,'h1');break;
    case 'h2': document.execCommand('formatBlock',false,'h2');break;
    case 'ul': document.execCommand('insertUnorderedList');break;
    case 'ol': document.execCommand('insertOrderedList');break;
    case 'quote': document.execCommand('formatBlock',false,'blockquote');break;
    case 'code': 
      const sel=window.getSelection();
      if(sel.rangeCount){const range=sel.getRangeAt(0);const code=document.createElement('code');range.surroundContents(code)};break;
    case 'hr': document.execCommand('insertHorizontalRule');break;
    default: document.execCommand(cmd);
  }
  updateActive();
}

function exportNotes(){
  const data=JSON.stringify(notes,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='zyraxon-notes-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  URL.revokeObjectURL(url);
  toast('নোট রপ্তানি হয়েছে');
}

function importNotes(){
  $('#fileInput').click();
}

$('#fileInput').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data)){toast('অবৈধ ফাইল');return}
      let added=0;
      data.forEach(n=>{
        if(n&&n.id&&n.content!==undefined){
          if(!notes.find(x=>x.id===n.id)){notes.push(n);added++}
        }
      });
      saveNotes();renderList();toast(added+' টি নোট আমদানি হয়েছে');
    }catch(err){toast('ফাইল পড়তে সমস্যা')}
  };
  reader.readAsText(file);
  e.target.value='';
});

let confirmCallback=null;
function confirmAction(title,msg,cb){
  $('#modalTitle').textContent=title;$('#modalMsg').textContent=msg;
  confirmCallback=cb;$('#confirmModal').classList.add('open');
}
$('#modalCancel').onclick=()=>{$('#confirmModal').classList.remove('open');confirmCallback=null};
$('#modalConfirm').onclick=()=>{$('#confirmModal').classList.remove('open');if(confirmCallback)confirmCallback();confirmCallback=null};

// Event listeners
$('#newNoteBtn').onclick=createNote;
$('#fabBtn').onclick=createNote;
$('#exportBtn').onclick=exportNotes;
$('#importBtn').onclick=importNotes;
$('#searchInput').addEventListener('input',()=>renderList());
$$('.tool-btn[data-cmd]').forEach(b=>b.addEventListener('click',()=>execCmd(b.dataset.cmd)));
$('#colorPicker').addEventListener('change',updateActive);
$('#pinBtn').onclick=()=>{if(activeId)togglePin()};
$('#deleteBtn').onclick=()=>{
  if(!activeId)return;
  confirmAction('নোট মুছুন','এই নোটটি স্থায়ীভাবে মুছে ফেলবেন?',()=>deleteNote(activeId));
};
$('#titleInput').addEventListener('input',debounce(updateActive,400));
$('#editor').addEventListener('input',debounce(updateActive,600));
$('#editor').addEventListener('paste',e=>{
  // keep formatting but strip dangerous
  setTimeout(updateActive,100);
});
$('#backBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('open')};
$('#overlay').onclick=()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open')};

function debounce(fn,delay){let t;return function(){clearTimeout(t);t=setTimeout(()=>fn.apply(this,arguments),delay)}}

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();createNote()}
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();updateActive();toast('সংরক্ষিত')}
  if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();$('#searchInput').focus()}
  if(e.key==='Escape'){$('#confirmModal').classList.remove('open')}
});

// Init
loadNotes();
if(notes.length===0){createNote()}else{activeId=notes[0].id;openNote(activeId)}
renderList();
updateStatus();

// Auto-save on visibility change
document.addEventListener('visibilitychange',()=>{if(document.hidden)updateActive()});
window.addEventListener('beforeunload',updateActive);
</script>
</body>
</html>

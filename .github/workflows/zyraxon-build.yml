name: ZYRAXON-Pro build
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build signed APK
        run: bash .zyraxon/build-apk.sh "CI Demo App" "com.zyraxon.cidemoapp" "web"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-demo-app-apk
          path: out/*.apk
      - name: Publish download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CI Demo App build ${{ github.run_number }}
          body: Built by ZYRAXON-Pro
          files: out/*.apk

  desktop:
    name: Desktop installers
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Electron
        run: npm install --no-save electron electron-builder
      - name: Package installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --config electron-builder.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-demo-app-${{ matrix.artifact }}
          path: dist/**
      - name: Publish download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CI Demo App build ${{ github.run_number }}
          body: Built by ZYRAXON-Pro
          files: dist/*
